#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -XX:+UseG1GC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2048M"
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

#Kotlin/Native
# iOS targets can only be built on macOS; silence "task is disabled" warnings on other hosts.
kotlin.native.ignoreDisabledTargets=true

#Roborazzi
# Put the recorded images in the output directory the plugin is configured with, instead of
# next to the module root.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
