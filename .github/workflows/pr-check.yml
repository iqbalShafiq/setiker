name: PR Checks

# The gate for every pull request: the app builds, the tests pass, the lint is clean, and the
# screenshot references still match what the app draws.
#
# The instrumented UI tests live in their own workflow, because they need an emulator and take
# much longer than the rest.

on:
  pull_request:
    branches: [main]
  # The work lands on main directly, so the checks have to run there too.
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the SDK and the command line tools, but the tools are not
      # on the path. The platform the app compiles against is not on the image either.
      - name: Install the SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Accept the SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Unit and view-model tests
        run: ./gradlew :composeApp:testAndroidHostTest --stacktrace

      - name: Screenshot and performance tests
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      # The screenshot *comparison* is a local gate, on purpose. The references are recorded with
      # the graphics library of the machine that made them, and that library renders text and
      # shadows differently on every operating system, so a reference recorded on Windows does not
      # match a render on Linux. Here the screenshots are drawn (which is the part that can break
      # on a machine without a screen); the comparison runs on the machine that recorded them.
      - name: The screenshots still draw
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            androidApp/build/reports/tests/
            composeApp/build/reports/tests/
          if-no-files-found: ignore

      - name: Lint
        run: ./gradlew :composeApp:lint --stacktrace

      - name: The app builds
        run: ./gradlew :androidApp:assembleDebug --stacktrace
