name: Device Checks

# The instrumented UI and accessibility tests, on an emulator.
#
# They are the tests that catch the things a JVM test cannot: a real window, a real semantics
# tree, a real screen reader, and the device quirks that break a test harness (a phone that
# refuses to start an activity in the background, for instance).

on:
  pull_request:
    branches: [main]
  # The work lands on main directly, so the checks have to run there too.
  push:
    branches: [main]

concurrency:
  group: device-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: The instrumented UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the SDK and the command line tools, but the tools are not
      # on the path. The platform the app compiles against is not on the image either.
      - name: Install the SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Accept the SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
